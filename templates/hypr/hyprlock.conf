input-field {
    monitor =
    size = 340, 42
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba({{primary.hex}}ff)
    inner_color = rgba({{login_field.hex}})
    font_color = rgb({{login_text.hex}})
    check_color = rgba({{accent.hex}}ff)
    fail_color = rgba({{urgent.hex}}ff)
    capslock_color = rgba({{urgent.hex}}ff)
    placeholder_text = <span foreground="##{{login_muted.hex}}">Password</span>
    fail_text = <span foreground="##{{urgent.hex}}">Wrong password</span>
    fade_on_empty = false
    rounding = -1
    position = 0, -220
    halign = center
    valign = center
}

